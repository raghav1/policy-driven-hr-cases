services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
      POSTGRES_DB: hr_policies
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_policies"]
      interval: 3s
      retries: 20

  agent:
    build: ./ai-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hr:hr@db:5432/hr_policies
    depends_on:
      db:
        condition: service_healthy
    # Only reachable from this machine; the public entry point is the gateway.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./corpus:/srv/corpus:ro

  gateway:
    image: caddy:2.8.4
    profiles: ["public"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - agent

volumes:
  pgdata:
  caddy_data:
